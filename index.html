<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Referral Form / ใบส่งตัวสัตว์ป่วย — Arak Animal Hospital Phuket</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="app-header">
        <img src="/logo.png" alt="Arak Animal Hospital Phuket" class="app-logo" />
        <h1>ใบส่งตัวสัตว์ป่วย / Referral Form</h1>
      </header>

      <form id="cert-form" novalidate>
        <section class="card">
          <div class="row">
            <div class="field">
              <label for="date">วันที่ / Date</label>
              <input type="date" id="date" name="date" required />
            </div>
            <div class="field">
              <label for="hn">HN</label>
              <input type="text" id="hn" name="hn" />
            </div>
          </div>
          <p class="static-line">เรียน สัตวแพทย์ผู้เกี่ยวข้อง / To Whom it may concern</p>
        </section>

        <section class="card">
          <h2>ข้อมูลสัตว์ป่วย / Pet's details</h2>
          <div class="row">
            <div class="field grow">
              <label for="petName">ชื่อสัตว์เลี้ยง / Pet's name</label>
              <input type="text" id="petName" name="petName" />
            </div>
            <div class="field">
              <label for="species">ชนิด / Species</label>
              <input type="text" id="species" name="species" />
            </div>
            <div class="field">
              <label for="gender">เพศ / Gender</label>
              <input type="text" id="gender" name="gender" />
            </div>
          </div>
          <div class="row">
            <div class="field grow">
              <label for="breed">พันธุ์ / Breed</label>
              <input type="text" id="breed" name="breed" />
            </div>
            <div class="field grow">
              <label for="age">อายุ / Age</label>
              <input type="text" id="age" name="age" placeholder="e.g. 3 ปี 2 เดือน / 3 years 2 months" />
            </div>
          </div>
          <div class="field">
            <label for="ownerName">ชื่อเจ้าของสัตว์เลี้ยง / Owner's name</label>
            <input type="text" id="ownerName" name="ownerName" />
          </div>
        </section>

        <section class="card">
          <h2>เพื่อ / For</h2>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="purpose" value="diagnosis" />
              <span>รับการวินิจฉัย / Diagnosis</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="purpose" value="treatment" />
              <span>รับการรักษา / Treatment</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="purpose" value="ownerRequest" />
              <span>ตามความต้องการของเจ้าของ / Owner request</span>
            </label>
          </div>
        </section>

        <section class="card">
          <div class="field">
            <label for="history">1. ประวัติอาการ / History</label>
            <textarea id="history" name="history" rows="4"></textarea>
          </div>
          <div class="field">
            <label for="physicalExam">2. อาการป่วยปัจจุบัน/ผลการตรวจร่างกาย / Physical Examination</label>
            <textarea id="physicalExam" name="physicalExam" rows="4"></textarea>
          </div>
          <div class="field">
            <label for="laboratory">3. ผลการตรวจทางห้องปฏิบัติการ / Laboratory</label>
            <textarea id="laboratory" name="laboratory" rows="4"></textarea>
          </div>
          <div class="field">
            <label for="diagnosis">4. การวินิจฉัยเบื้องต้น / Diagnosis</label>
            <textarea id="diagnosis" name="diagnosis" rows="4"></textarea>
          </div>
          <div class="field">
            <label for="treatment">5. การรักษา / Treatment</label>
            <textarea id="treatment" name="treatment" rows="4"></textarea>
          </div>
          <div class="field">
            <label for="others">6. รายละเอียดอื่นๆ / Others</label>
            <textarea id="others" name="others" rows="4"></textarea>
          </div>
        </section>

        <section class="card">
          <h2>สัตวแพทย์ผู้ส่งตัว / Referring veterinarian</h2>
          <div class="row">
            <div class="field grow">
              <label for="vetName">ชื่อสัตวแพทย์ / Veterinarian name</label>
              <input type="text" id="vetName" name="vetName" />
            </div>
            <div class="field grow">
              <label for="licenseNo">ใบอนุญาตเลขที่ / Veterinary License No.</label>
              <input type="text" id="licenseNo" name="licenseNo" />
            </div>
          </div>
        </section>

        <div class="actions">
          <button type="button" id="clear-draft-btn" class="secondary">Clear form</button>
          <button type="submit" id="generate-btn">Generate .docx</button>
        </div>
        <p id="status-msg" class="status-msg" role="status" aria-live="polite"></p>
      </form>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
